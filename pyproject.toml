[project]
name = "veil"
version = "0.1.0"
description = "OpenAI-compatible privacy gateway: mask PII/PHI before it reaches any LLM, restore it in the answer."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "presidio-analyzer>=2.2",
  "faker>=24",
  "cryptography>=42",
  "pyyaml>=6",
]

[project.optional-dependencies]
gliner = ["gliner>=0.2"]
mcp = ["mcp>=1.2"]
eval = ["datasets>=2.19", "pandas>=2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
veil-mcp = "veil.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["veil"]

[tool.setuptools.package-data]
veil = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
